spring:
  application:
    name: setaccio-lab
  ai:
    model:
      chat: ollama
    chat:
      client:
        tool-search-advisor:
          enabled: ${SETACCIO_LAB_TOOL_SEARCH_ENABLED:false}
          tool-index-type: ${SETACCIO_LAB_TOOL_SEARCH_INDEX_TYPE:regex}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
          max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
    ollama:
      base-url: ${OLLAMA_BASE_URL:${OLLAMA_API_BASE:http://localhost:11434}}
      init:
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_MODEL:gemma4:e2b}

server:
  port: 8082

setaccio:
  lab:
    results-dir: ${SETACCIO_LAB_OUTPUT_DIR:build/lab-results}
    tool-fixtures:
      fixed-instant: ${SETACCIO_LAB_TOOL_FIXTURE_INSTANT:2026-01-15T12:00:00Z}
