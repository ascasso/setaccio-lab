    description = 'Regenerates and verifies a saved vision matrix summary without starting Spring or calling a model provider.'
    dependsOn tasks.named('visionMatrixClasses')
    classpath.from(sourceSets.visionMatrix.runtimeClasspath)
    mainClass.set('com.setaccio.lab.vision.VisionMatrixOfflineRunner')
    mode.set('reanalyze')
    javaExecutable.set(javaToolchains.launcherFor {
