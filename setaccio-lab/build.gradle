tasks.register('visionMatrixCompare', VisionMatrixComparisonTask) {
    description = 'Compares two verified saved vision matrices without starting Spring or calling a model provider.'
    dependsOn tasks.named('visionMatrixClasses')
    classpath.from(sourceSets.visionMatrix.runtimeClasspath)
    mainClass.set('com.setaccio.lab.vision.VisionMatrixComparisonRunner')
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.map { it.executablePath.asFile.absolutePath })
