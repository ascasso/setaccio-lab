tasks.register('visionHumanReviewPrepare', VisionHumanReviewPrepareTask) {
    dependsOn tasks.named('visionMatrixClasses')
    classpath.from(sourceSets.visionMatrix.runtimeClasspath)
    mainClass.set('com.setaccio.lab.vision.VisionHumanReviewPrepareRunner')
    workingDirectory.set(layout.projectDirectory)
    reviewRoot.set(layout.buildDirectory.dir('vision-human-review'))
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.map { it.executablePath.asFile.absolutePath })
}

tasks.register('visionMatrixTest', Test) {
    description = 'Runs offline tests for the opt-in sequential vision matrix.'
    group = 'verification'
    testClassesDirs = sourceSets.visionMatrixTest.output.classesDirs
    classpath = sourceSets.visionMatrixTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}
