plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

import com.setaccio.gradle.ToolSearchSmokeTask
import com.setaccio.gradle.ToolSearchMatrixBaselineTask
import com.setaccio.gradle.ToolSearchMatrixOfflineTask
import com.setaccio.gradle.ToolCompatibilityMatrixTask
import com.setaccio.gradle.ToolCompatibilityOfflineTask
import com.setaccio.gradle.ChatMatrixOfflineTask
import com.setaccio.gradle.ChatMatrixTask
import com.setaccio.gradle.AnthropicChatMatrixTask
import com.setaccio.gradle.LocalEvaluationOfflineTask
import com.setaccio.gradle.LocalEvaluationTask
import com.setaccio.gradle.VisionHumanReviewPrepareTask
import com.setaccio.gradle.VisionMatrixOfflineTask
import com.setaccio.gradle.VisionMatrixComparisonTask
import com.setaccio.gradle.VisionMatrixTask

description = 'Setaccio Lab'

def libs = extensions.getByName('libs')

dependencies {
    implementation project(':setaccio-core')

    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.ai.starter.model.anthropic
    implementation libs.spring.ai.starter.model.ollama
    implementation libs.spring.ai.starter.tool.search.advisor
    implementation libs.spring.boot.starter.cache
    implementation libs.caffeine
    implementation libs.jackson.datatype.jsr310

    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.junit.platform.launcher
}

dependencyManagement {
    imports {
        mavenBom libs.spring.ai.bom.get().toString()
    }
    dependencies {
        dependency libs.commons.codec.get().toString()
        dependency libs.slf4j.api.get().toString()
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = true
}

sourceSets {
    toolSearchSmoke {
        java.srcDir 'src/toolSearchSmoke/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    toolSearchSmokeTest {
        java.srcDir 'src/toolSearchSmokeTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.toolSearchSmoke.output
        runtimeClasspath += output + compileClasspath
    }
    visionMatrix {
        java.srcDir 'src/visionMatrix/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    visionMatrixTest {
        java.srcDir 'src/visionMatrixTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.visionMatrix.output
        runtimeClasspath += output + compileClasspath
    }
    localEvaluation {
        java.srcDir 'src/localEvaluation/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    localEvaluationTest {
        java.srcDir 'src/localEvaluationTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.localEvaluation.output
        runtimeClasspath += output + compileClasspath
    }
    chatMatrix {
        java.srcDir 'src/chatMatrix/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    chatMatrixTest {
        java.srcDir 'src/chatMatrixTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.chatMatrix.output
        runtimeClasspath += output + compileClasspath
    }
    toolCompatibility {
        java.srcDir 'src/toolCompatibility/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    toolCompatibilityTest {
        java.srcDir 'src/toolCompatibilityTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.toolCompatibility.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    toolSearchSmokeImplementation.extendsFrom implementation
    toolSearchSmokeRuntimeOnly.extendsFrom runtimeOnly
    toolSearchSmokeTestImplementation.extendsFrom testImplementation, toolSearchSmokeImplementation
    toolSearchSmokeTestRuntimeOnly.extendsFrom testRuntimeOnly, toolSearchSmokeRuntimeOnly
    visionMatrixImplementation.extendsFrom implementation
    visionMatrixRuntimeOnly.extendsFrom runtimeOnly
    visionMatrixTestImplementation.extendsFrom testImplementation, visionMatrixImplementation
    visionMatrixTestRuntimeOnly.extendsFrom testRuntimeOnly, visionMatrixRuntimeOnly
    localEvaluationImplementation.extendsFrom implementation
    localEvaluationRuntimeOnly.extendsFrom runtimeOnly
    localEvaluationTestImplementation.extendsFrom testImplementation, localEvaluationImplementation
    localEvaluationTestRuntimeOnly.extendsFrom testRuntimeOnly, localEvaluationRuntimeOnly
    chatMatrixImplementation.extendsFrom implementation
    chatMatrixRuntimeOnly.extendsFrom runtimeOnly
    chatMatrixTestImplementation.extendsFrom testImplementation, chatMatrixImplementation
    chatMatrixTestRuntimeOnly.extendsFrom testRuntimeOnly, chatMatrixRuntimeOnly
    toolCompatibilityImplementation.extendsFrom implementation
    toolCompatibilityRuntimeOnly.extendsFrom runtimeOnly
    toolCompatibilityTestImplementation.extendsFrom testImplementation, toolCompatibilityImplementation
    toolCompatibilityTestRuntimeOnly.extendsFrom testRuntimeOnly, toolCompatibilityRuntimeOnly
}

tasks.register('chatMatrix', ChatMatrixTask) {
    dependsOn tasks.named('chatMatrixClasses')
    classpath.from(sourceSets.chatMatrix.runtimeClasspath)
    mainClass.set('com.setaccio.lab.chatmatrix.ChatMatrixRunner')
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.map { it.executablePath.asFile.absolutePath })
}

tasks.register('anthropicChatMatrix', AnthropicChatMatrixTask) {
    dependsOn tasks.named('chatMatrixClasses')
    classpath.from(sourceSets.chatMatrix.runtimeClasspath)
