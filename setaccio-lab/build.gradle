plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

import com.setaccio.gradle.ToolSearchSmokeTask
import com.setaccio.gradle.ToolSearchMatrixBaselineTask
import com.setaccio.gradle.ToolSearchMatrixOfflineTask

description = 'Setaccio Lab'

def libs = extensions.getByName('libs')

dependencies {
    implementation project(':setaccio-core')

    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.ai.starter.model.anthropic
    implementation libs.spring.ai.starter.model.ollama
    implementation libs.spring.ai.starter.tool.search.advisor
    implementation libs.spring.boot.starter.cache
    implementation libs.caffeine
    implementation libs.jackson.datatype.jsr310

    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.junit.platform.launcher
}

dependencyManagement {
    imports {
        mavenBom libs.spring.ai.bom.get().toString()
    }
    dependencies {
        dependency libs.commons.codec.get().toString()
        dependency libs.slf4j.api.get().toString()
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = true
}

sourceSets {
    toolSearchSmoke {
        java.srcDir 'src/toolSearchSmoke/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    toolSearchSmokeTest {
        java.srcDir 'src/toolSearchSmokeTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.toolSearchSmoke.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    toolSearchSmokeImplementation.extendsFrom implementation
    toolSearchSmokeRuntimeOnly.extendsFrom runtimeOnly
    toolSearchSmokeTestImplementation.extendsFrom testImplementation, toolSearchSmokeImplementation
    toolSearchSmokeTestRuntimeOnly.extendsFrom testRuntimeOnly, toolSearchSmokeRuntimeOnly
}

tasks.register('toolSearchSmoke', ToolSearchSmokeTask) {
    dependsOn tasks.named('toolSearchSmokeClasses')
    classpath.from(sourceSets.toolSearchSmoke.runtimeClasspath)
    mainClass.set('com.setaccio.lab.smoke.ToolSearchSmokeRunner')
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.map { it.executablePath.asFile.absolutePath })
}

tasks.register('toolSearchMatrixBaseline', ToolSearchMatrixBaselineTask) {
    dependsOn tasks.named('toolSearchSmokeClasses')
    classpath.from(sourceSets.toolSearchSmoke.runtimeClasspath)
    mainClass.set('com.setaccio.lab.smoke.ToolSearchMatrixBaselineRunner')
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.map { it.executablePath.asFile.absolutePath })
}

tasks.register('toolSearchMatrixVerify', ToolSearchMatrixOfflineTask) {
    description = 'Verifies a saved Tool Search matrix without calling a model provider.'
    dependsOn tasks.named('toolSearchSmokeClasses')
    classpath.from(sourceSets.toolSearchSmoke.runtimeClasspath)
    mainClass.set('com.setaccio.lab.smoke.ToolSearchMatrixOfflineRunner')
    mode.set('verify')
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.map { it.executablePath.asFile.absolutePath })
}

tasks.register('toolSearchMatrixReanalyze', ToolSearchMatrixOfflineTask) {
    description = 'Regenerates and verifies a saved Tool Search matrix summary without calling a model provider.'
    dependsOn tasks.named('toolSearchSmokeClasses')
    classpath.from(sourceSets.toolSearchSmoke.runtimeClasspath)
    mainClass.set('com.setaccio.lab.smoke.ToolSearchMatrixOfflineRunner')
    mode.set('reanalyze')
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.map { it.executablePath.asFile.absolutePath })
}

tasks.register('toolSearchSmokeTest', Test) {
    description = 'Runs offline tests for the opt-in Tool Search smoke analyzer.'
    group = 'verification'
    testClassesDirs = sourceSets.toolSearchSmokeTest.output.classesDirs
    classpath = sourceSets.toolSearchSmokeTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}
