tasks.register('chatMatrixTest', Test) {
    description = 'Runs provider-free tests for the dedicated sequential Ollama chat matrix.'
    group = 'verification'
    testClassesDirs = sourceSets.chatMatrixTest.output.classesDirs
    classpath = sourceSets.chatMatrixTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

