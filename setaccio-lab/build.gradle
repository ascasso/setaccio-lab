    description = 'Verifies saved Anthropic chat matrix evidence without starting Spring or calling a provider.'
    dependsOn tasks.named('chatMatrixClasses')
    classpath.from(sourceSets.chatMatrix.runtimeClasspath)
    mainClass.set('com.setaccio.lab.chatmatrix.AnthropicChatMatrixOfflineRunner')
    mode.set('verify')
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.map { it.executablePath.asFile.absolutePath })
}

